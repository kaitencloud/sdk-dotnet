version: '3'
tasks:
  restore:
    cmds: [dotnet restore KaitenCloud.sln --locked-mode]
  build:
    deps: [restore]
    cmds: [dotnet build KaitenCloud.sln -c Release --no-restore]
  test:
    deps: [build]
    cmds: [dotnet test tests/KaitenCloud.Sdk.Tests -c Release --no-build --no-restore --verbosity quiet]
  pack:
    deps: [build]
    cmds: [dotnet pack src/KaitenCloud.Sdk -c Release --no-build --no-restore -o artifacts/packages]
  consume:
    deps: [pack]
    cmds:
      - sh scripts/check-package.sh
  contracts:check:
    desc: Verify standalone pinned contracts and explicit operation coverage
    cmds:
      - python3 scripts/check_contracts.py
      - python3 -B -m unittest discover -s tests -p "test_*.py" -q
  codegen:kiota:check:
    desc: Reproduce the internal Kiota experiment (requires already installed Kiota 1.30.0)
    cmds:
      - task: contracts:check
      - python3 scripts/kiota-spike.py --check
  codegen:kiota:test:
    desc: Characterize the rejected private Kiota experiment
    deps: [codegen:kiota:check]
    cmds:
      - dotnet restore tests/KiotaSpike/KiotaSpike.csproj --locked-mode
      - dotnet test tests/KiotaSpike/KiotaSpike.csproj -c Release --no-restore --verbosity quiet
  codegen:check:
    desc: Reproduce accepted STJ models, metadata and wire fixtures without tools or network
    cmds:
      - python3 scripts/generate-management.py --check
      - python3 scripts/generate-management-fixtures.py --check
  check:
    cmds:
      - task: contracts:check
      - task: codegen:check
      - task: test
      - task: consume
  example:
    deps: [build]
    cmds: [dotnet run --project examples/Kaiten.Example -c Release --no-build --no-restore]
  integration:
    deps: [build]
    cmds: [dotnet run --project tests/KaitenCloud.Sdk.Integration -c Release --no-build --no-restore]
