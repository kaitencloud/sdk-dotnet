version: '3'
tasks:
  restore:
    cmds: [dotnet restore KaitenCloud.sln --locked-mode]
  build:
    deps: [restore]
    cmds: [dotnet build KaitenCloud.sln -c Release --no-restore]
  test:
    deps: [build]
    cmds: [dotnet test tests/KaitenCloud.Sdk.Tests -c Release --no-build --no-restore --verbosity quiet]
  pack:
    deps: [build]
    desc: Pack revised uncommitted-source verification bytes, never historical 0.3.0
    cmds: [dotnet pack src/KaitenCloud.Sdk -c Release --no-build --no-restore -p:PackageVersion=0.3.0-native-uncommitted -o artifacts/native-sdk-uncommitted/packages]
  consume:
    deps: [pack]
    cmds: [dotnet run --project tools/KaitenCloud.ContractTool -c Release --no-build --no-restore -- package]
  contracts:check:
    desc: Verify standalone pinned contracts and explicit operation coverage using .NET
    cmds: [dotnet run --project tools/KaitenCloud.ContractTool -c Release -- contracts]
  codegen:check:
    desc: Reproduce STJ models, metadata and wire fixtures using .NET without network or sibling repos
    cmds:
      - dotnet run --project tools/KaitenCloud.ContractTool -c Release -- generate --check
      - dotnet run --project tools/KaitenCloud.ContractTool -c Release --no-build --no-restore -- fixtures --check
  codegen:
    desc: Explicitly regenerate approved STJ models, metadata and wire fixtures for review
    cmds:
      - dotnet run --project tools/KaitenCloud.ContractTool -c Release -- generate
      - dotnet run --project tools/KaitenCloud.ContractTool -c Release --no-build --no-restore -- fixtures
  check:
    cmds:
      - task: contracts:check
      - task: codegen:check
      - task: test
      - task: consume
  example:
    deps: [build]
    cmds: [dotnet run --project examples/Kaiten.Example -c Release --no-build --no-restore]
  integration:
    deps: [build]
    cmds: [dotnet run --project tests/KaitenCloud.Sdk.Integration -c Release --no-build --no-restore]
